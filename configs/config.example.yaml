# configs/config.example.yaml
server:
  listen_addr: ":9290"
  log_level: "info"
  log_encoding: "console"

defaults:
  port: 10050
  timeout: 5s
  # Covers Zabbix 2.0–6.x agents (ZBXD header + bare key, no JSON) — the
  # most common case. Override per host with "plain" (pre-2.0, no header
  # at all) or "json" (7.0+, ZBXD header + JSON request/response).
  protocol: "legacy"

hosts:
  srv-old-01: {}
  # Legacy Zabbix agent 1.8.5 on Solaris (see the "solaris" module below) —
  # predates the ZBXD framing introduced in 2.0, so requests must be sent
  # as a bare newline-terminated key with no header.
  legacy-solaris-185:
    protocol: "plain"
  # Current Zabbix agent 7.0.3 on Solaris (see the "solaris_modern" module
  # below) — speaks the newer JSON passive-check protocol.
  modern-solaris-703:
    port: 10051
    protocol: "json"

modules:
  linux:
    items:
      - key: "agent.ping"
        metric: "zabbix_agent_ping"
        type: gauge
        help: "Agent reachability (1=up)"
      - key: "system.cpu.load[,avg1]"
        metric: "zabbix_cpu_load1"
        type: gauge
        help: "CPU load average 1m"
      - key: "system.uptime"
        metric: "zabbix_uptime_seconds"
        type: gauge
        help: "System uptime in seconds"
      - key: "vm.memory.size[available]"
        metric: "zabbix_memory_available_bytes"
        type: gauge
        help: "Available memory in bytes"
      - key: "vm.memory.size[total]"
        metric: "zabbix_memory_total_bytes"
        type: gauge
        help: "Total memory in bytes"
    discovered_items:
      - discovery_key: "vfs.fs.discovery"
        value_key: "vfs.fs.size[{#FSNAME},pfree]"
        metric: "zabbix_fs_free_percent"
        type: gauge
        help: "Free space percent per filesystem"
        label_name: "mountpoint"
        label_field: "{#FSNAME}"
      - discovery_key: "net.if.discovery"
        value_key: "net.if.in[{#IFNAME}]"
        metric: "zabbix_net_if_in_bytes"
        type: counter
        help: "Network bytes received per interface"
        label_name: "interface"
        label_field: "{#IFNAME}"

  # Example module for a legacy Zabbix agent (v1.8.x, pre-LLD) on Solaris,
  # relying entirely on custom UserParameter keys defined in the agent's
  # own config (see configs/zabbix_agentd.solaris.conf.example). Agents
  # this old don't support native discovery keys (vfs.fs.discovery,
  # net.if.discovery, ...); the custom "list" UserParameters in that
  # example config (listif_solaris, listfs_solaris, listdisk_solaris)
  # return a plain newline-separated list of names instead, which
  # line_list_items turns into a presence (1) series per line/entity, each
  # labeled with that line's text — there's no second UserParameter key
  # per entity on this agent, so unlike discovered_items there's no value
  # to query beyond presence.
  solaris:
    items:
      - key: "agent.ping"
        metric: "zabbix_agent_ping"
        type: gauge
        help: "Agent reachability (1=up)"
      - key: "cpu.global"
        metric: "zabbix_cpu_usage_percent"
        type: gauge
        help: "CPU usage percent (UserParameter: sar -u)"
      - key: "memory.used"
        metric: "zabbix_memory_used_bytes"
        type: gauge
        help: "Used memory in bytes (UserParameter: prtconf/vmstat)"
      - key: "avg.rtm"
        metric: "zabbix_tcp_retransmit_percent"
        type: gauge
        help: "TCP retransmit percent (UserParameter: netstat -s -P tcp)"
      - key: "net.pkt.rtm"
        metric: "zabbix_tcp_retransmit_bytes_total"
        type: counter
        help: "TCP retransmitted bytes (UserParameter: netstat -s -P tcp)"
      - key: "num.port.used"
        metric: "zabbix_tcp_ports_used"
        type: gauge
        help: "Number of established TCP connections (UserParameter: netstat -an -P tcp)"
    line_list_items:
      - key: "listfs_solaris"
        metric: "zabbix_fs_present"
        help: "Filesystem is present (UserParameter: df -k)"
        label_name: "mountpoint"
      - key: "listif_solaris"
        metric: "zabbix_net_if_present"
        help: "Network interface is present (UserParameter: ifconfig -a)"
        label_name: "interface"
      - key: "listdisk_solaris"
        metric: "zabbix_disk_present"
        help: "Disk device is present (UserParameter: iostat -En)"
        label_name: "device"

  # Example module for a current Zabbix agent (7.0.x, prebuilt for Solaris
  # 10/SPARC) on Solaris — unlike the legacy "solaris" module above (a 1.8.5
  # agent with no LLD support), this one has native discovery keys, so
  # filesystems and network interfaces are enumerated the same way as the
  # linux module via discovered_items instead of line_list_items. Verified
  # against a real `zabbix_agentd -p` dump: `vfs.fs.size[<fs>,pfree]` and
  # `net.if.in[<if>,bytes]` both exist, though the latter may return
  # ZBX_NOTSUPPORTED on zone/virtual interfaces (e.g. vnet0) depending on
  # what kernel statistics the zone has access to — that's handled like any
  # other per-item failure (logged, counted, scrape continues).
  solaris_modern:
    items:
      - key: "agent.ping"
        metric: "zabbix_agent_ping"
        type: gauge
        help: "Agent reachability (1=up)"
      - key: "system.cpu.load[all,avg1]"
        metric: "zabbix_cpu_load1"
        type: gauge
        help: "CPU load average 1m"
      - key: "system.cpu.num[online]"
        metric: "zabbix_cpu_count"
        type: gauge
        help: "Number of online CPUs"
      - key: "system.uptime"
        metric: "zabbix_uptime_seconds"
        type: gauge
        help: "System uptime in seconds"
      - key: "system.swap.size[all,free]"
        metric: "zabbix_swap_free_bytes"
        type: gauge
        help: "Free swap space in bytes"
      - key: "kernel.maxproc"
        metric: "zabbix_kernel_maxproc"
        type: gauge
        help: "Maximum number of processes the kernel can run"
    discovered_items:
      - discovery_key: "vfs.fs.discovery"
        value_key: "vfs.fs.size[{#FSNAME},pfree]"
        metric: "zabbix_fs_free_percent"
        type: gauge
        help: "Free space percent per filesystem"
        label_name: "mountpoint"
        label_field: "{#FSNAME}"
      - discovery_key: "net.if.discovery"
        value_key: "net.if.in[{#IFNAME},bytes]"
        metric: "zabbix_net_if_in_bytes"
        type: counter
        help: "Network bytes received per interface"
        label_name: "interface"
        label_field: "{#IFNAME}"

  # Example module for a Windows host running zabbix_agentd/zabbix_agent2.
  # Unlike the legacy Solaris agent above, a reasonably current Windows
  # agent supports native LLD (vfs.fs.discovery, net.if.discovery), so
  # disks and network interfaces are enumerated the same way as the linux
  # module rather than via line_list_items.
  windows:
    items:
      - key: "agent.ping"
        metric: "zabbix_agent_ping"
        type: gauge
        help: "Agent reachability (1=up)"
      - key: "system.cpu.util"
        metric: "zabbix_cpu_util_percent"
        type: gauge
        help: "Total CPU utilization percent"
      - key: "system.uptime"
        metric: "zabbix_uptime_seconds"
        type: gauge
        help: "System uptime in seconds"
      - key: "vm.memory.size[available]"
        metric: "zabbix_memory_available_bytes"
        type: gauge
        help: "Available memory in bytes"
      - key: "vm.memory.size[total]"
        metric: "zabbix_memory_total_bytes"
        type: gauge
        help: "Total memory in bytes"
      - key: "perf_counter[\\PhysicalDisk(_Total)\\Avg. Disk Queue Length]"
        metric: "zabbix_disk_queue_length"
        type: gauge
        help: "Average physical disk queue length (Windows PerfCounter)"
    discovered_items:
      - discovery_key: "vfs.fs.discovery"
        value_key: "vfs.fs.size[{#FSNAME},pfree]"
        metric: "zabbix_fs_free_percent"
        type: gauge
        help: "Free space percent per filesystem/drive"
        label_name: "drive"
        label_field: "{#FSNAME}"
      - discovery_key: "net.if.discovery"
        value_key: "net.if.in[{#IFNAME}]"
        metric: "zabbix_net_if_in_bytes"
        type: counter
        help: "Network bytes received per interface"
        label_name: "interface"
        label_field: "{#IFNAME}"

groups:
  - name: "tous-linux"
    hosts: ["srv-old-01"]
    modules: ["linux"]
  - name: "solaris-legacy"
    hosts: ["legacy-solaris-185"]
    modules: ["solaris"]
  - name: "solaris-moderne"
    hosts: ["modern-solaris-703"]
    modules: ["solaris_modern"]
